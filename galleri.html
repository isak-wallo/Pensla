<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pensla – alla bilder</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #eef4fa; color: #2c3440; }
    header { position: sticky; top: 0; z-index: 1; background: #fff; padding: 12px 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
    h1 { font-size: 20px; margin: 0; }
    #antal { font-weight: 600; }
    button { font: inherit; border: 1px solid #c8d4e2; background: #f6f9fc; border-radius: 8px;
        padding: 6px 12px; cursor: pointer; }
    button:hover { background: #e6eef7; }
    #lista { flex-basis: 100%; font-family: Consolas, monospace; font-size: 12px; line-height: 1.35; background: #f3f6f9;
        border-radius: 6px; padding: 4px 8px; word-break: break-word; white-space: pre-wrap;
        max-height: 4.2em; overflow: auto; }
    /* Telefon: rubriken följer inte med vid scroll, så bilderna får hela skärmen. */
    @media (max-width: 700px) {
        header { position: static; gap: 6px 8px; padding: 10px 12px; }
        h1 { font-size: 17px; flex-basis: 100%; }
        header button, header select { font-size: 13px; padding: 4px 8px; }
    }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 14px; padding: 16px; }
    .kort { background: #fff; border-radius: 10px; overflow: hidden; border: 3px solid transparent;
        box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .kort.vald { border-color: #3a8ee6; }
    .kort.kommenterad { box-shadow: 0 0 0 2px #f0a030; }
    .kort.dold, h2.dold { display: none; }
    h2 { grid-column: 1 / -1; margin: 10px 0 -4px; font-size: 18px; }
    h2 span { font-weight: 400; color: #6a7686; font-size: 15px; }
    .par { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: #dde5ee; }
    .par img, .par .tom { display: block; width: 100%; aspect-ratio: 4 / 3; background: #fff; object-fit: contain; }
    .par .tom { display: flex; align-items: center; justify-content: center; color: #8a96a6;
        background: repeating-linear-gradient(45deg, #f4f7fa 0 12px, #fff 12px 24px); }
    .kort.utan .rad label { color: #8a96a6; cursor: default; }
    .rad { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px 4px; }
    .rad label + label { margin-left: 4px; color: #a03030; }
    .kort.borttagen { opacity: .6; }
    .nr { font-weight: 700; font-size: 18px; min-width: 2.2em; }
    .rad label { margin-left: auto; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .rad input { width: 20px; height: 20px; cursor: pointer; }
    textarea { display: block; width: calc(100% - 20px); margin: 4px 10px 10px; font: inherit; font-size: 14px;
        border: 1px solid #c8d4e2; border-radius: 6px; padding: 6px 8px; resize: vertical; min-height: 2.4em; }
</style>
</head>
<body>
<header>
    <h1>Pensla – alla bilder</h1>
    <span id="antal"></span>
    <select id="filter">
        <option value="alla">Visa alla</option>
        <option value="valda">Bara aktiva</option>
        <option value="ovalda">Bara ej aktiva</option>
        <option value="kommenterade">Bara med kommentar</option>
        <option value="borttagna">Bara markerade ta bort</option>
    </select>
    <button id="allaPa">Välj alla</button>
    <button id="allaAv">Välj ingen</button>
    <button id="kopiera">Kopiera listan</button>
    <button id="aterstall">Återställ till appens nuvarande</button>
    <button id="rensa">Rensa alla kommentarer</button>
    <div id="lista"></div>
</header>
<main id="galleri"></main>
<script src="bilder.js"></script>
<script>
    // Galleri för att välja vilka bilder som ska vara aktiva i appen.
    // Varje bild visas med konturer och färgbild bredvid varandra. Kryssa i
    // de aktiva och skriv en kommentar om något behöver kontrolleras. Valen
    // sparas i webbläsaren; kopiera listan och skicka den, så förs den in i
    // AKTIVA i bilder.js och kommentarerna åtgärdas. Bilder med "ta bort"
    // ikryssat tonas ner här; när listan skickas förs de in i
    // BORTTAGNA i bilder.js (filerna och numret ligger kvar i repot).
    const NYCKEL = 'pensla-galleri-val';
    const KOMMENTARER = 'pensla-galleri-kommentarer';
    let valda;
    try { valda = JSON.parse(localStorage.getItem(NYCKEL)); } catch (e) { valda = null; }
    // Har AKTIVA i bilder.js ändrats sedan valen sparades (listan är
    // inskickad och införd), börjar galleriet om från appens nuvarande.
    const AKTIVA_NYCKEL = 'pensla-galleri-aktiva';
    let nyAppLista = false;
    try { nyAppLista = localStorage.getItem(AKTIVA_NYCKEL) !== JSON.stringify(AKTIVA); } catch (e) { }
    if (!Array.isArray(valda) || nyAppLista) valda = AKTIVA.slice();
    valda = new Set(valda);
    let kommentarer;
    try { kommentarer = JSON.parse(localStorage.getItem(KOMMENTARER)); } catch (e) { kommentarer = null; }
    if (!kommentarer || typeof kommentarer !== 'object') kommentarer = {};
    const BORT_NYCKEL = 'pensla-galleri-borttagna';
    let borttagna;
    try { borttagna = JSON.parse(localStorage.getItem(BORT_NYCKEL)); } catch (e) { borttagna = null; }
    borttagna = new Set(Array.isArray(borttagna) && !nyAppLista ? borttagna : []);
    // Bilder i BORTTAGNA (bilder.js) är bortplockade för gott.
    const BILDER = ALLA_BILDER.filter(b => !BORTTAGNA.includes(b.nr));

    // Bilderna visas grupperade i kategorier (KATEGORIER, i den ordningen),
    // så att liknande bilder hamnar bredvid varandra. Inom kategorin
    // sorteras de efter sort (namnet utan löpnummer) och nummer. En sort
    // som inte står i någon kategori blir en egen kategori sist.
    const KATEGORIER = [
        ['Båtar', ['Båt', 'Segelbåt', 'Räddningsbåt', 'Lastfartyg']],
        ['Flygplan', ['Flygplan', 'Stort flygplan']],
        ['Helikoptrar och raketer', ['Helikopter', 'Raket']],
        ['Tåg och bussar', ['Tåg', 'Buss']],
        ['Utryckning', ['Polisbil', 'Ambulans', 'Brandbil']],
        ['Bygge', ['Grävare', 'Dumper', 'Betongbil', 'Kranbil']],
        ['På gården', ['Traktor', 'Skördetröska']],
        ['På gatan', ['Sopbil', 'Plogbil', 'Bärgningsbil', 'Postbil']],
    ];
    const sort = b => b.namn.replace(/ \(arkiv \d+\)$/, '').replace(/ \d+$/, '').replace(/ snett$/, '');
    const plats = b => {
        const i = KATEGORIER.findIndex(([, sorter]) => sorter.includes(sort(b)));
        return i < 0 ? [KATEGORIER.length, 0] : [i, KATEGORIER[i][1].indexOf(sort(b))];
    };
    const typ = b => { const i = plats(b)[0]; return i < KATEGORIER.length ? KATEGORIER[i][0] : sort(b); };
    const sorterade = BILDER.slice().sort((a, b) => {
        const [ka, sa] = plats(a), [kb, sb] = plats(b);
        return ka - kb || typ(a).localeCompare(typ(b), 'sv') || sa - sb || a.nr - b.nr;
    });
    const galleri = document.getElementById('galleri');
    const rubriker = {};
    const kort = sorterade.map(b => {
        if (!rubriker[typ(b)]) {
            const h = document.createElement('h2');
            h.textContent = typ(b) + ' ';
            h.appendChild(document.createElement('span'));
            galleri.appendChild(h);
            rubriker[typ(b)] = h;
        }
        const k = document.createElement('div');
        // Bilder utan färgbild (utanFarg) visas men kan inte väljas.
        k.className = b.utanFarg ? 'kort utan' : 'kort';
        k.innerHTML = `<div class="par">
                <img src="bilder/farg/${b.fil}.svg" loading="lazy" alt="Konturer">
                ${b.utanFarg ? '<div class="tom">saknar färgbild</div>'
                    : `<img src="bilder/farg/${b.fil}.jpg" loading="lazy" alt="Färgbild">`}
            </div>
            <div class="rad"><span class="nr">${b.nr}</span><span>${b.namn}</span>
                <label><input type="checkbox"${b.utanFarg ? ' disabled' : ''}> ${b.utanFarg ? 'saknar färg' : 'aktiv'}</label>
                <label><input type="checkbox" class="bort"> ta bort</label></div>
            <textarea rows="1" placeholder="Kommentar: vad behöver kontrolleras?"></textarea>`;
        const ruta = k.querySelector('input');
        const text = k.querySelector('textarea');
        const bort = k.querySelector('.bort');
        bort.addEventListener('change', () => {
            if (bort.checked) { borttagna.add(b.nr); valda.delete(b.nr); }
            else borttagna.delete(b.nr);
            uppdatera();
        });
        text.value = kommentarer[b.nr] || '';
        ruta.addEventListener('change', () => {
            if (ruta.checked) valda.add(b.nr); else valda.delete(b.nr);
            uppdatera();
        });
        text.addEventListener('input', () => {
            if (text.value.trim()) kommentarer[b.nr] = text.value; else delete kommentarer[b.nr];
            uppdatera();
        });
        galleri.appendChild(k);
        return { b, k, ruta, text, bort };
    });

    const finns = b => !borttagna.has(b.nr);
    function lista() { return [...valda].filter(n => BILDER.some(b => b.nr === n && !b.utanFarg && finns(b))).sort((a, b) => a - b); }

    function uppdatera() {
        const filter = document.getElementById('filter').value;
        kort.forEach(({ b, k, ruta, text, bort }) => {
            const vald = valda.has(b.nr);
            const komm = !!text.value.trim();
            const borta = borttagna.has(b.nr);
            ruta.checked = vald;
            ruta.disabled = !!b.utanFarg || borta;
            bort.checked = borta;
            k.classList.toggle('vald', vald);
            k.classList.toggle('kommenterad', komm);
            k.classList.toggle('borttagen', borta);
            k.classList.toggle('dold', (filter === 'borttagna' && !borta)
                || (filter === 'valda' && !vald) || (filter === 'ovalda' && vald)
                || (filter === 'kommenterade' && !komm));
        });
        for (const [t, h] of Object.entries(rubriker)) {
            const alla = kort.filter(({ b }) => typ(b) === t);
            const egna = alla.filter(({ b }) => finns(b));
            h.classList.toggle('dold', alla.every(({ k }) => k.classList.contains('dold')));
            const valbara = egna.filter(({ b }) => !b.utanFarg);
            h.lastChild.textContent = `(${valbara.filter(({ b }) => valda.has(b.nr)).length} av ${valbara.length} aktiva`
                + (valbara.length < egna.length ? `, ${egna.length - valbara.length} utan färg)` : ')');
        }
        const l = lista();
        const bort = BILDER.filter(b => borttagna.has(b.nr)).map(b => b.nr).sort((a, b) => a - b);
        const k = BILDER.filter(b => finns(b) && (kommentarer[b.nr] || '').trim())
            .map(b => `  ${b.nr} ${b.namn}: ${kommentarer[b.nr].trim().replace(/\s*\n\s*/g, ' / ')}`);
        document.getElementById('antal').textContent =
            `${l.length} aktiva av ${BILDER.filter(b => !b.utanFarg && finns(b)).length}, ${k.length} med kommentar`
            + (bort.length ? `, ${bort.length} att ta bort` : '');
        document.getElementById('lista').textContent = 'AKTIVA: ' + l.join(', ')
            + (bort.length ? '\nTA BORT: ' + bort.join(', ') : '')
            + (k.length ? '\nKONTROLLERA:\n' + k.join('\n') : '');
        try {
            localStorage.setItem(NYCKEL, JSON.stringify(l));
            localStorage.setItem(KOMMENTARER, JSON.stringify(kommentarer));
            localStorage.setItem(BORT_NYCKEL, JSON.stringify([...borttagna]));
            localStorage.setItem(AKTIVA_NYCKEL, JSON.stringify(AKTIVA));
        } catch (e) { }
    }

    document.getElementById('filter').addEventListener('change', uppdatera);
    document.getElementById('kopiera').addEventListener('click', e => {
        const text = document.getElementById('lista').textContent;
        navigator.clipboard.writeText(text).then(() => {
            e.target.textContent = 'Kopierad ✓';
            setTimeout(() => { e.target.textContent = 'Kopiera listan'; }, 1500);
        });
    });
    document.getElementById('allaPa').addEventListener('click', () => {
        valda = new Set(BILDER.filter(b => !b.utanFarg && finns(b)).map(b => b.nr));
        uppdatera();
    });
    document.getElementById('allaAv').addEventListener('click', () => {
        valda = new Set();
        uppdatera();
    });
    document.getElementById('rensa').addEventListener('click', () => {
        if (!confirm('Rensa alla kommentarer?')) return;
        kommentarer = {};
        kort.forEach(({ text }) => { text.value = ''; });
        uppdatera();
    });
    document.getElementById('aterstall').addEventListener('click', () => {
        valda = new Set(AKTIVA);
        uppdatera();
    });
    uppdatera();
</script>
</body>
</html>
