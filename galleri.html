<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pensla – alla bilder</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #eef4fa; color: #2c3440; }
    header { position: sticky; top: 0; z-index: 1; background: #fff; padding: 12px 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,.08); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
    h1 { font-size: 20px; margin: 0; }
    #antal { font-weight: 600; }
    #version { color: #6a7686; }
    button { font: inherit; border: 1px solid #c8d4e2; background: #f6f9fc; border-radius: 8px;
        padding: 6px 12px; cursor: pointer; }
    button:hover { background: #e6eef7; }
    #flikar { flex-basis: 100%; display: flex; gap: 6px; }
    #flikar button { font-weight: 600; }
    #flikar button.vald { background: #3a8ee6; border-color: #3a8ee6; color: #fff; }
    #lista { flex-basis: 100%; font-family: Consolas, monospace; font-size: 12px; line-height: 1.35; background: #f3f6f9;
        border-radius: 6px; padding: 4px 8px; word-break: break-word; white-space: pre-wrap;
        max-height: 4.2em; overflow: auto; }
    /* Telefon: rubriken följer inte med vid scroll, så bilderna får hela skärmen. */
    @media (max-width: 700px) {
        header { position: static; gap: 6px 8px; padding: 10px 12px; }
        h1 { font-size: 17px; flex-basis: 100%; }
        header button { font-size: 13px; padding: 4px 8px; }
    }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 14px; padding: 16px; }
    .kort { background: #fff; border-radius: 10px; overflow: hidden; border: 3px solid transparent;
        box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .kort.vald { border-color: #3a8ee6; }
    .kort.kommenterad { box-shadow: 0 0 0 2px #f0a030; }
    .kort.dold, h2.dold { display: none; }
    h2 { grid-column: 1 / -1; margin: 10px 0 -4px; font-size: 18px; }
    h2 span { font-weight: 400; color: #6a7686; font-size: 15px; }
    #tom { grid-column: 1 / -1; color: #6a7686; }
    .par { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: #dde5ee; }
    .par img, .par .tom { display: block; width: 100%; aspect-ratio: 4 / 3; background: #fff; object-fit: contain; }
    .par .tom { display: flex; align-items: center; justify-content: center; color: #8a96a6;
        background: repeating-linear-gradient(45deg, #f4f7fa 0 12px, #fff 12px 24px); }
    .kort.utan .rad label:first-of-type { color: #8a96a6; cursor: default; }
    .rad { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px 4px; }
    .rad label + label { margin-left: 4px; color: #a03030; }
    .kort.borttagen .par { opacity: .55; }
    .nr { font-weight: 700; font-size: 18px; min-width: 2.2em; }
    .andras { font-size: 13px; font-weight: 600; color: #fff; background: #e08a1e; border-radius: 10px; padding: 1px 8px; }
    .andras:empty { display: none; }
    .rad label { margin-left: auto; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .rad input { width: 20px; height: 20px; cursor: pointer; }
    textarea { display: block; width: calc(100% - 20px); margin: 4px 10px 10px; font: inherit; font-size: 14px;
        border: 1px solid #c8d4e2; border-radius: 6px; padding: 6px 8px; resize: vertical; min-height: 2.4em; }
</style>
</head>
<body>
<header>
    <h1>Pensla – alla bilder</h1>
    <span id="antal"></span>
    <span id="version"></span>
    <button id="allaPa">Välj alla i fliken</button>
    <button id="allaAv">Välj ingen i fliken</button>
    <button id="kopiera">Kopiera listan</button>
    <button id="aterstall">Återställ till appens nuvarande</button>
    <button id="rensa">Rensa alla kommentarer</button>
    <div id="flikar"></div>
    <div id="lista"></div>
</header>
<main id="galleri"></main>
<script src="bilder.js?farsk"></script>
<script>
    // Galleri för att välja vilka bilder som ska vara aktiva i appen.
    // Alla bilder i ALLA_BILDER visas, i tre flikar efter hur de står i
    // appen just nu: aktiva (AKTIVA), inaktiva och borttagna (BORTTAGNA).
    // Varje bild visas med konturer och färgbild bredvid varandra. Kryssa
    // i "aktiv" eller "ta bort" och skriv en kommentar om något behöver
    // kontrolleras. En bild som ändras stannar i sin flik och får en
    // etikett (t.ex. "blir aktiv"), tills listan är införd. Valen sparas i
    // webbläsaren; kopiera listan och skicka den, så förs den in i AKTIVA
    // och BORTTAGNA i bilder.js (filerna och numren ligger kvar i repot).
    const NYCKEL = 'pensla-galleri-val';
    const KOMMENTARER = 'pensla-galleri-kommentarer';
    const BORT_NYCKEL = 'pensla-galleri-borttagna';
    const FLIK_NYCKEL = 'pensla-galleri-flik';
    // Har AKTIVA eller BORTTAGNA i bilder.js ändrats sedan valen sparades
    // (listan är inskickad och införd), börjar galleriet om från appens
    // nuvarande.
    const APP_NYCKEL = 'pensla-galleri-app';
    const appNu = JSON.stringify([AKTIVA, BORTTAGNA]);
    const las = (nyckel, reserv) => {
        try { const v = JSON.parse(localStorage.getItem(nyckel)); return v === null ? reserv : v; }
        catch (e) { return reserv; }
    };
    let nyAppLista = true;
    try { nyAppLista = localStorage.getItem(APP_NYCKEL) !== appNu; } catch (e) { }
    let valda = las(NYCKEL, null);
    valda = new Set(Array.isArray(valda) && !nyAppLista ? valda : AKTIVA);
    let borttagna = las(BORT_NYCKEL, null);
    borttagna = new Set(Array.isArray(borttagna) && !nyAppLista ? borttagna : BORTTAGNA);
    let kommentarer = las(KOMMENTARER, {});
    if (!kommentarer || typeof kommentarer !== 'object') kommentarer = {};

    // Bildens flik: hur den står i appen just nu
    const FLIKAR = [['aktiva', 'Aktiva'], ['inaktiva', 'Inaktiva'], ['borttagna', 'Borttagna']];
    const lage = b => BORTTAGNA.includes(b.nr) ? 'borttagna' : AKTIVA.includes(b.nr) ? 'aktiva' : 'inaktiva';
    let flik = las(FLIK_NYCKEL, 'aktiva');
    if (!FLIKAR.some(([f]) => f === flik)) flik = 'aktiva';

    // Bilderna visas grupperade i kategorier (KATEGORIER, i den ordningen),
    // så att liknande bilder hamnar bredvid varandra. Inom kategorin
    // sorteras de efter sort (namnet utan löpnummer) och nummer. En sort
    // som inte står i någon kategori blir en egen kategori sist.
    const KATEGORIER = [
        ['Båtar', ['Båt', 'Segelbåt', 'Räddningsbåt', 'Lastfartyg']],
        ['Flygplan', ['Flygplan', 'Stort flygplan']],
        ['Helikoptrar och raketer', ['Helikopter', 'Raket']],
        ['Tåg och bussar', ['Tåg', 'Buss']],
        ['Utryckning', ['Polisbil', 'Ambulans', 'Brandbil']],
        ['Bygge', ['Grävare', 'Dumper', 'Betongbil', 'Kranbil']],
        ['På gården', ['Traktor', 'Skördetröska']],
        ['På gatan', ['Sopbil', 'Plogbil', 'Bärgningsbil', 'Postbil']],
    ];
    const sort = b => b.namn.replace(/ \(arkiv \d+\)$/, '').replace(/ \d+$/, '').replace(/ snett$/, '');
    const plats = b => {
        const i = KATEGORIER.findIndex(([, sorter]) => sorter.includes(sort(b)));
        return i < 0 ? [KATEGORIER.length, 0] : [i, KATEGORIER[i][1].indexOf(sort(b))];
    };
    const typ = b => { const i = plats(b)[0]; return i < KATEGORIER.length ? KATEGORIER[i][0] : sort(b); };
    const sorterade = ALLA_BILDER.slice().sort((a, b) => {
        const [ka, sa] = plats(a), [kb, sb] = plats(b);
        return ka - kb || typ(a).localeCompare(typ(b), 'sv') || sa - sb || a.nr - b.nr;
    });
    const galleri = document.getElementById('galleri');
    const rubriker = {};
    const kort = sorterade.map(b => {
        if (!rubriker[typ(b)]) {
            const h = document.createElement('h2');
            h.textContent = typ(b) + ' ';
            h.appendChild(document.createElement('span'));
            galleri.appendChild(h);
            rubriker[typ(b)] = h;
        }
        const k = document.createElement('div');
        // Bilder utan färgbild (utanFarg) visas men kan inte bli aktiva.
        k.className = b.utanFarg ? 'kort utan' : 'kort';
        k.innerHTML = `<div class="par">
                <img src="bilder/farg/${b.fil}.svg" loading="lazy" alt="Konturer">
                ${b.utanFarg ? '<div class="tom">saknar färgbild</div>'
                    : `<img src="bilder/farg/${b.fil}.jpg" loading="lazy" alt="Färgbild">`}
            </div>
            <div class="rad"><span class="nr">${b.nr}</span><span>${b.namn}</span><span class="andras"></span>
                <label><input type="checkbox" class="aktiv"> ${b.utanFarg ? 'saknar färg' : 'aktiv'}</label>
                <label><input type="checkbox" class="bort"> ta bort</label></div>
            <textarea rows="1" placeholder="Kommentar: vad behöver kontrolleras?"></textarea>`;
        const ruta = k.querySelector('.aktiv');
        const bort = k.querySelector('.bort');
        const text = k.querySelector('textarea');
        ruta.addEventListener('change', () => {
            if (ruta.checked) valda.add(b.nr); else valda.delete(b.nr);
            uppdatera();
        });
        bort.addEventListener('change', () => {
            if (bort.checked) { borttagna.add(b.nr); valda.delete(b.nr); }
            else borttagna.delete(b.nr);
            uppdatera();
        });
        text.value = kommentarer[b.nr] || '';
        text.addEventListener('input', () => {
            if (text.value.trim()) kommentarer[b.nr] = text.value; else delete kommentarer[b.nr];
            uppdatera();
        });
        galleri.appendChild(k);
        return { b, k, ruta, bort, text, andras: k.querySelector('.andras') };
    });
    const tom = document.createElement('p');
    tom.id = 'tom';
    tom.textContent = 'Inga bilder här.';
    galleri.appendChild(tom);

    const flikknappar = FLIKAR.map(([f, text]) => {
        const knapp = document.createElement('button');
        knapp.addEventListener('click', () => {
            flik = f;
            try { localStorage.setItem(FLIK_NYCKEL, JSON.stringify(f)); } catch (e) { }
            uppdatera();
            window.scrollTo(0, 0);
        });
        document.getElementById('flikar').appendChild(knapp);
        return { f, text, knapp };
    });

    // Det bilden blir när listan förs in, om det skiljer sig från nu
    function andring(b) {
        const borta = borttagna.has(b.nr), vald = valda.has(b.nr) && !borta;
        const var_ = lage(b);
        if (borta) return var_ === 'borttagna' ? '' : 'tas bort';
        if (var_ === 'borttagna') return vald ? 'tas tillbaka, aktiv' : 'tas tillbaka';
        if (vald) return var_ === 'aktiva' ? '' : 'blir aktiv';
        return var_ === 'aktiva' ? 'blir inaktiv' : '';
    }

    function uppdatera() {
        kort.forEach(({ b, k, ruta, bort, text, andras }) => {
            const borta = borttagna.has(b.nr);
            const vald = valda.has(b.nr) && !borta;
            ruta.checked = vald;
            ruta.disabled = !!b.utanFarg || borta;
            bort.checked = borta;
            andras.textContent = andring(b);
            k.classList.toggle('vald', vald);
            k.classList.toggle('borttagen', borta);
            k.classList.toggle('kommenterad', !!text.value.trim());
            k.classList.toggle('dold', lage(b) !== flik);
        });
        for (const [t, h] of Object.entries(rubriker)) {
            const synliga = kort.filter(({ b, k }) => typ(b) === t && !k.classList.contains('dold'));
            h.classList.toggle('dold', !synliga.length);
            h.lastChild.textContent = `(${synliga.length})`;
        }
        tom.hidden = kort.some(({ k }) => !k.classList.contains('dold'));
        flikknappar.forEach(({ f, text, knapp }) => {
            knapp.textContent = `${text} (${ALLA_BILDER.filter(b => lage(b) === f).length})`;
            knapp.classList.toggle('vald', f === flik);
        });

        const aktiva = ALLA_BILDER.filter(b => valda.has(b.nr) && !borttagna.has(b.nr) && !b.utanFarg)
            .map(b => b.nr).sort((a, b) => a - b);
        const bort = ALLA_BILDER.filter(b => borttagna.has(b.nr) && !BORTTAGNA.includes(b.nr)).map(b => b.nr).sort((a, b) => a - b);
        const tillbaka = BORTTAGNA.filter(n => !borttagna.has(n)).sort((a, b) => a - b);
        const k = ALLA_BILDER.filter(b => (kommentarer[b.nr] || '').trim())
            .map(b => `  ${b.nr} ${b.namn}: ${kommentarer[b.nr].trim().replace(/\s*\n\s*/g, ' / ')}`);
        const andringar = kort.filter(({ b }) => andring(b)).length;
        document.getElementById('antal').textContent = `${aktiva.length} aktiva, ${k.length} med kommentar`
            + (andringar ? `, ${andringar} ändringar` : '');
        document.getElementById('lista').textContent = 'AKTIVA: ' + aktiva.join(', ')
            + (bort.length ? '\nTA BORT: ' + bort.join(', ') : '')
            + (tillbaka.length ? '\nTA TILLBAKA: ' + tillbaka.join(', ') : '')
            + (k.length ? '\nKONTROLLERA:\n' + k.join('\n') : '');
        try {
            localStorage.setItem(NYCKEL, JSON.stringify(aktiva));
            localStorage.setItem(KOMMENTARER, JSON.stringify(kommentarer));
            localStorage.setItem(BORT_NYCKEL, JSON.stringify([...borttagna]));
            localStorage.setItem(APP_NYCKEL, appNu);
        } catch (e) { }
    }

    document.getElementById('kopiera').addEventListener('click', e => {
        const text = document.getElementById('lista').textContent;
        navigator.clipboard.writeText(text).then(() => {
            e.target.textContent = 'Kopierad ✓';
            setTimeout(() => { e.target.textContent = 'Kopiera listan'; }, 1500);
        });
    });
    // Välj alla / ingen gäller bilderna i den öppna fliken
    const iFliken = () => kort.filter(({ b }) => lage(b) === flik && !b.utanFarg && !borttagna.has(b.nr));
    document.getElementById('allaPa').addEventListener('click', () => {
        iFliken().forEach(({ b }) => valda.add(b.nr));
        uppdatera();
    });
    document.getElementById('allaAv').addEventListener('click', () => {
        iFliken().forEach(({ b }) => valda.delete(b.nr));
        uppdatera();
    });
    document.getElementById('rensa').addEventListener('click', () => {
        if (!confirm('Rensa alla kommentarer?')) return;
        kommentarer = {};
        kort.forEach(({ text }) => { text.value = ''; });
        uppdatera();
    });
    document.getElementById('aterstall').addEventListener('click', () => {
        valda = new Set(AKTIVA);
        borttagna = new Set(BORTTAGNA);
        uppdatera();
    });
    uppdatera();

    // Versionen som ligger ute just nu (VERSION i sw.js, utan cache)
    fetch('sw.js?farsk', { cache: 'no-store' }).then(r => r.text()).then(t => {
        const v = t.match(/const VERSION = '([^']*)'/);
        if (v) document.getElementById('version').textContent = 'Version ' + v[1];
    }).catch(() => { });
</script>
</body>
</html>
